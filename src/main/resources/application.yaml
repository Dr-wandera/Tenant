server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Tenant
    username: postgres
    password: ${SQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ## Email config
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORDKEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  data:
    redis:
      host: localhost
      port: 6379
      username: tenant
      password: ${REDIS_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

# Application sender details
app:
  mail:
    from: ${GMAIL_USERNAME_EMAIL}
    sender-name: Tenant Hub
